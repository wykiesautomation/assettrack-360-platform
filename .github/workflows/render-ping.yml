name: Render health check

on:
  schedule:
    - cron: '2-57/5 * * * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check backend
        env:
          CHECK_URL: https://YOUR-APP.onrender.com/health
        run: |
          curl --fail --silent --show-error \
            --connect-timeout 15 --max-time 90 \
            --output /dev/null "$CHECK_URL"
